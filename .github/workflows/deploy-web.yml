# Deploys the web app to Firebase Hosting on every push to main.
#
# Setup is one GitHub secret (see WEB_APP_GUIDE.md step 6A):
#   secret FIREBASE_SERVICE_ACCOUNT — the service-account JSON, pasted whole
#
# The project id is read out of src/config.js, so there is nothing else to
# configure. Set the optional variable FIREBASE_PROJECT_ID only if you want to
# deploy somewhere other than the project the app talks to.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      # `src/**` matters as much as `web/**` now: web/js/ is generated from it
      # and is not in git, so a source-only change would otherwise never deploy.
      - 'src/**'
      - 'web/**'
      - 'build.mjs'
      - 'tsconfig*.json'
      - 'package.json'
      - 'firebase.json'
      - 'firebase/firestore.rules'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  # The deploy publishes web/ AND firebase/firestore.rules to the live project,
  # so nothing reaches production without the suite passing first. Before
  # 23 Sep 2026 this workflow ran no test of any kind.
  gate:
    name: Tests must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:guard
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      # The rules file is deployed below. `test/refused-rules.mjs` temporarily
      # replaces it with a deny-all ruleset and restores it afterwards; if a run
      # ever crashed before the restore and the result was committed, this
      # catches it before it locks every user out of their own data.
      - name: Refuse to deploy a deny-all ruleset
        run: |
          if grep -qE 'allow read, *write: *if false' firebase/firestore.rules \
             && ! grep -q 'published' firebase/firestore.rules; then
            echo "firebase/firestore.rules looks like the deny-all test ruleset."
            echo "Restore it with: git checkout firebase/firestore.rules"
            exit 1
          fi

      # Import the module rather than grepping it, so single quotes, double
      # quotes and trailing commas all read the same.
      - name: Read and check the Firebase config
        id: config
        run: |
          node --input-type=module -e "
            const { firebaseConfig: c } = await import('./src/config.js');
            const missing = ['apiKey', 'projectId'].filter((k) => !c[k]);
            if (missing.length) {
              console.error('src/config.js is missing: ' + missing.join(', '));
              console.error('Paste your Firebase web config into it — WEB_APP_GUIDE.md step 2.');
              process.exit(1);
            }
            console.log('projectId=' + c.projectId);
          " | tee -a "$GITHUB_OUTPUT"

      - name: Check the deploy credential exists
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The FIREBASE_SERVICE_ACCOUNT secret is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "See WEB_APP_GUIDE.md step 6A."
            exit 1
          fi

      # web/js/ is build output and is not committed, so Hosting would publish
      # an app with no JavaScript at all without this.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: The build must have produced the app
        run: |
          test -f web/js/app.js || { echo "web/js/app.js missing after build"; exit 1; }
          echo "web/js holds $(find web/js -name '*.js' | wc -l) modules"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || steps.config.outputs.projectId }}
          channelId: live

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules \
            --project "${{ vars.FIREBASE_PROJECT_ID || steps.config.outputs.projectId }}" \
            --non-interactive

      - name: Where it landed
        run: |
          id="${{ vars.FIREBASE_PROJECT_ID || steps.config.outputs.projectId }}"
          echo "Deployed. Open https://$id.web.app on your iPhone in Safari," >> "$GITHUB_STEP_SUMMARY"
          echo "then Share → Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
