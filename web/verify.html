<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- VERIFICATION HARNESS. Not application code, not deployed.
     Byte-identical to web/index.html except:
       - no <base href="/"> (it breaks relative assets in a preview subpath)
       - a 390x844 frame so every capture matches the established design frame
     The real app.css and the real js/app.js module graph are loaded unchanged. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Travel Planner — verification harness</title>
<meta name="theme-color" content="#F2F3F1">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { margin: 0; background: #E4E6E2; }
  /* The established mobile design frame. The app's own #app cap is 520px, so at
     390px it is simply under the cap and lays out exactly as on a phone. */
  #frame {
    width: 390px; height: 844px; margin: 0; overflow: hidden;
    position: relative; background: #F2F3F1;
  }
  #frame #app { max-width: 390px; height: 844px; }
  /* Neutralise the >=560px desktop letterbox so the frame is the phone case. */
  @media (min-width: 560px) {
    #frame #app { box-shadow: none; border: 0; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="app">
    <div id="screen" class="screen-host"></div>
    <div id="strip" class="strip-slot" hidden></div>
    <div id="undo" class="undo-slot" hidden></div>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <div id="boot" class="boot">
    <div class="boot-mark">MC</div>
    <div class="boot-text">Loading your trip…</div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module">
  // Expose the real store and nav so states can be driven through the app's
  // own API rather than by writing markup. Read-only plumbing.
  import * as store from './js/store.js';
  import * as nav from './js/nav.js';
  import * as share from './js/share.js';
  import * as parts from './js/screens/parts.js';
  window.S = store; window.NAV = nav; window.SHARE = share; window.PARTS = parts;
  window.__ready = true;
</script>
</body>
</html>
