<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#14201C"/>
  <!-- The agent's main route: solid jade, numbered stops. -->
  <path d="M128 168 L214 240 L300 200 L384 288" fill="none" stroke="#1F6F5C"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Your own loop off it: dashed amber. -->
  <path d="M214 240 L176 330 L268 356 L300 200" fill="none" stroke="#C87F0A"
        stroke-width="14" stroke-dasharray="10 26" stroke-linecap="round"/>
  <circle cx="128" cy="168" r="30" fill="#1F6F5C"/>
  <circle cx="384" cy="288" r="30" fill="#1F6F5C"/>
  <circle cx="214" cy="240" r="38" fill="#F2F3F1"/>
  <circle cx="268" cy="356" r="19" fill="#C87F0A"/>
  <circle cx="176" cy="330" r="19" fill="#C87F0A"/>
</svg>
